services:
  fin-exporter:
    build: .
    restart: unless-stopped
    # Joins the Prometheus network so Prometheus scrapes fin-exporter:9102.
    # No ports are published to the host. /metrics requires basic auth
    # (web-config.yml) because it listens on a non-loopback address.
    networks: [prometheus]
    volumes:
      - ./fin-exporter.yaml:/etc/fin-exporter/fin-exporter.yaml:ro
      - ./web-config.yml:/etc/fin-exporter/web-config.yml:ro
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  prometheus:
    external: true
    name: prometheus-grafana_default
